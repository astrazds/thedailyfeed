# Install inside the host Nginx http {} context (for example conf.d/).
# Replace reader.example.com and provision its certificate before nginx -t.
limit_req_zone $binary_remote_addr zone=dailyfeed:10m rate=1r/s;
log_format dailyfeed '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name reader.example.com;
    return 308 https://reader.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name reader.example.com;
    ssl_certificate /etc/letsencrypt/live/reader.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reader.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/dailyfeed-access.log dailyfeed;
    # Error logs can contain request details; restrict access and retention.
    error_log /var/log/nginx/dailyfeed-error.log warn;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 45s;
    limit_req zone=dailyfeed burst=120 nodelay;
    limit_req_status 429;

    # Metrics stay private at ingress; the app also requires a bearer token.
    location = /api/metrics { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 45s;
        proxy_read_timeout 45s;
        proxy_buffering off;
        proxy_cache off;
        # Buffer the bounded incoming body, never the progressive response.
        proxy_request_buffering on;
    }
}
