services:
  thedailyfeed:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.0"
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_SERVICE_NAME=${LOG_SERVICE_NAME:-thedailyfeed}
      - LOG_REDACT_FIELDS=${LOG_REDACT_FIELDS:-authorization,cookie,set-cookie,password,token}
      - APP_VERSION=${APP_VERSION:-1.1.12}
      - APP_COMMIT=${APP_COMMIT:-unknown}
      - FEED_TIMEOUT_MS=${FEED_TIMEOUT_MS:-10000}
      - FEED_RETRY_COUNT=${FEED_RETRY_COUNT:-3}
      - FEED_OVERALL_TIMEOUT_MS=${FEED_OVERALL_TIMEOUT_MS:-30000}
      - FEED_REQUEST_TIMEOUT_MS=${FEED_REQUEST_TIMEOUT_MS:-30000}
      - FEED_CACHE_TTL_MS=${FEED_CACHE_TTL_MS:-3600000}
      - FEED_CACHE_MAX_ENTRIES=${FEED_CACHE_MAX_ENTRIES:-200}
      - METRICS_AUTH_TOKEN=${METRICS_AUTH_TOKEN:-}
      # Keep production SSRF protection enabled.
      - ALLOW_PRIVATE_NETWORKS=${ALLOW_PRIVATE_NETWORKS:-false}
      # Timezone support
      - TZ=${TZ:-UTC}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /app/.next/cache:rw,nosuid,nodev,size=128m,uid=1001,gid=1001,mode=1770
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
