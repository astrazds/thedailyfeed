name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: docker-node-runner

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Derive build metadata
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          APP_COMMIT="$(git rev-parse --short HEAD)"

          {
            echo "APP_VERSION=$APP_VERSION"
            echo "APP_COMMIT=$APP_COMMIT"
          } >> "$GITHUB_ENV"

          echo "Using APP_VERSION=$APP_VERSION"
          echo "Using APP_COMMIT=$APP_COMMIT"

      - name: Verify Compose metadata
        run: |
          rendered_compose="$(mktemp)"
          docker compose -f compose.yml config > "$rendered_compose"

          grep -F "APP_VERSION: $APP_VERSION" "$rendered_compose"
          grep -F "APP_COMMIT: $APP_COMMIT" "$rendered_compose"

      - name: Install pnpm
        run: npm install --global pnpm@10.33.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
