name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  verify:
    runs-on: srv1-ci

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run complete verification gate
        run: ./scripts/verify-ci.sh
