name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  verify:
    runs-on: docker-node-runner
    container:
      image: node:24-bookworm

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Derive build metadata
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          APP_COMMIT="$(git rev-parse --short HEAD)"

          {
            echo "APP_VERSION=$APP_VERSION"
            echo "APP_COMMIT=$APP_COMMIT"
          } >> "$GITHUB_ENV"

          echo "Using APP_VERSION=$APP_VERSION"
          echo "Using APP_COMMIT=$APP_COMMIT"

      - name: Verify Compose metadata
        run: |
          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            rendered_compose="$(mktemp)"
            docker compose -f compose.yml config > "$rendered_compose"

            grep -Fq "APP_VERSION: $APP_VERSION" "$rendered_compose"
            grep -Fq "APP_COMMIT: $APP_COMMIT" "$rendered_compose"
            echo "Compose metadata renders APP_VERSION=$APP_VERSION and APP_COMMIT=$APP_COMMIT."
          else
            grep -Eq 'APP_VERSION=\$\{APP_VERSION:-[^}]+\}' compose.yml
            grep -Fq 'APP_COMMIT=${APP_COMMIT:-unknown}' compose.yml
            echo "Compose metadata interpolation hooks are present."
          fi

      - name: Install pnpm
        run: npm install --global pnpm@10.33.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build Docker image
        uses: docker://gcr.io/kaniko-project/executor:v1.23.2
        with:
          args: >-
            --context=${{ github.workspace }}
            --dockerfile=${{ github.workspace }}/Dockerfile
            --no-push
            --destination=thedailyfeed:${{ env.APP_COMMIT }}
