name: Deploy production

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Production branch
        required: true
        type: choice
        options:
          - main
      confirmation:
        description: Type deploy-production
        required: true
        type: string

permissions:
  contents: read

env:
  CI: true

jobs:
  verify-and-deploy:
    runs-on: srv1-ci

    steps:
      - name: Validate dispatch authorization
        env:
          SELECTED_BRANCH: ${{ inputs.branch }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -eu
          [ "$FORGEJO_REF" = "refs/heads/main" ]
          [ "$SELECTED_BRANCH" = "main" ]
          [ "$DEPLOY_CONFIRMATION" = "deploy-production" ]

      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run complete verification gate
        run: ./scripts/verify-ci.sh

      - name: Deploy exact dispatched commit
        env:
          SRV1_DEPLOY_KEY: ${{ secrets.SRV1_DEPLOY_KEY }}
        run: |
          set -eu
          umask 077
          key_file="$(mktemp "${RUNNER_TEMP:-/tmp}/thedailyfeed-deploy-key.XXXXXX")"
          cleanup() {
            rm -f "$key_file"
          }
          trap cleanup EXIT HUP INT TERM
          printf '%s\n' "$SRV1_DEPLOY_KEY" > "$key_file"
          unset SRV1_DEPLOY_KEY

          ssh -F /dev/null \
            -i "$key_file" \
            -o BatchMode=yes \
            -o ClearAllForwardings=yes \
            -o IdentitiesOnly=yes \
            -o RequestTTY=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/.forgejo/srv1_known_hosts" \
            astrazds@srv1.astrazds.net \
            "deploy $GITHUB_SHA"

      - name: Verify public homepage
        run: |
          set -eu
          status="$(curl \
            --fail \
            --location \
            --max-time 30 \
            --output /dev/null \
            --proto '=https' \
            --proto-redir '=https' \
            --show-error \
            --silent \
            --tlsv1.2 \
            --write-out '%{http_code}' \
            'https://dailyfeed.astrazds.net/')"
          [ "$status" = "200" ]
          printf 'homepage_status=%s\n' "$status"
